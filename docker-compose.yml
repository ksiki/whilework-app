x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file: .env
  environment:  
    - TZ=Europe/Moscow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__PARALLELISM=4
    - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=2
    - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=300
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=60
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  networks:
    - backend_network

services:
  db:
    image: postgres:17-alpine
    container_name: database
    restart: always
    command: postgres -c shared_buffers=128MB -c max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-test_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      TZ: Europe/Moscow
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    environment:
      TZ: Europe/Moscow
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app
    restart: always
    command: /app/scripts/entrypoint.sh
    env_file: .env
    environment:
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static:/app/staticfiles
      - media:/app/media
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  taskiq_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskiq_worker
    restart: always
    command: taskiq worker core.broker:broker --workers 1 --max-async-tasks 5 --fs-discover
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./backend:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - app
      - rabbitmq
    networks:
      - backend_network

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 800M

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: >
      bash -c "airflow db migrate && 
      airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    restart: always
    environment:
      TZ: Europe/Moscow
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      - app
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  static:
  media: