<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
            text { text-rendering: optimizeLegibility; }
        </style>

        <radialGradient id="lightGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#F5F3FF" />
            <stop offset="100%" stop-color="#FFFFFF" />
        </radialGradient>

        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>
    </defs>

    <rect width="1200" height="600" fill="url(#lightGlow)" />

    <text x="250" y="350" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="240" fill="#EDE9FE" text-anchor="middle" opacity="0.6">{</text>
    <text x="950" y="350" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="240" fill="#EDE9FE" text-anchor="middle" opacity="0.6">}</text>

    <text x="600" y="320" text-anchor="middle">
        <tspan font-family="'JetBrains Mono', monospace" font-weight="700" font-size="96" fill="url(#accent)">W</tspan>
        <tspan font-family="'Inter', sans-serif" font-weight="700" font-size="72" fill="#111827" letter-spacing="-2">HILE(</tspan>
        <tspan font-family="'JetBrains Mono', monospace" font-weight="700" font-size="96" fill="url(#accent)">W</tspan>
        <tspan font-family="'Inter', sans-serif" font-weight="700" font-size="72" fill="#111827" letter-spacing="-2">ORK)</tspan>
    </text>

    <text x="600" y="400" font-family="'Inter', sans-serif" font-weight="500" font-size="28" fill="#6B7280" text-anchor="middle" letter-spacing="0.5">
        вакансии с прямыми контактами
    </text>
</svg>
