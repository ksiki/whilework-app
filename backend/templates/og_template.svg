<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
            text { text-rendering: optimizeLegibility; }
        </style>

        <radialGradient id="glow" cx="80%" cy="0%" r="80%">
            <stop offset="0%" stop-color="#F5F3FF" />
            <stop offset="100%" stop-color="#FFFFFF" />
        </radialGradient>

        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>

        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F3F4F6" stroke-width="1" opacity="0.8"/>
        </pattern>
    </defs>

    <rect width="1200" height="630" fill="url(#glow)" />
    <rect width="1200" height="630" fill="url(#grid)" />
    <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

    <text x="80" y="100">
        <tspan font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="url(#accent)">W</tspan>
        <tspan font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#111827" letter-spacing="-0.5">HILE(</tspan>
        <tspan font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="url(#accent)">W</tspan>
        <tspan font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#111827" letter-spacing="-0.5">ORK)</tspan>
    </text>

    <text x="80" y="240" font-family="'Inter', sans-serif" font-weight="600" font-size="24" fill="#6B7280">
        {{ meta }}
    </text>

    <text x="80" y="320" font-family="'Inter', sans-serif" font-weight="700" font-size="64" fill="#111827" letter-spacing="-1">
        {{ line_1 }}
    </text>
    <text x="80" y="395" font-family="'Inter', sans-serif" font-weight="700" font-size="64" fill="#111827" letter-spacing="-1">
        {{ line_2 }}
    </text>

    <text x="80" y="480" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="48" fill="#111827">
        {{ salary }}
    </text>

    <rect x="80" y="515" width="1040" height="90" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    
    <circle cx="110" cy="545" r="6" fill="#10B981" />

    <text x="135" y="551" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#6B7280">
        {{ features_string }}
    </text>

    <text x="135" y="585" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="20" fill="url(#accent)">
        {{ skills_string }}
    </text>
</svg>
