upstream django_app {
    server app:8000;
}

proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=sitemap_cache:10m max_size=1g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name whilework.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name whilework.site;

    ssl_certificate /root/whilework-app/nginx/origin.pem;
    ssl_certificate_key /root/whilework-app/nginx/origin.key;

    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_max_body_size 10M; 
    limit_conn conn_limit_per_ip 20;

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        proxy_cache sitemap_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        alias /app/media/;
    }

    location /api/internal/ {
        deny all;

        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_redirect off;
    }

    location / {
        limit_req zone=req_limit_per_ip burst=20 nodelay;

        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /portal-manage-xyz/ {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        include uwsgi_params;
        uwsgi_pass unix:/run/uwsgi/app/your_project/socket;
    }
}